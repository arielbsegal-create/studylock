<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StudyLock | Elite Focus RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div id="loginScreen" class="login">
        <div class="login-circle">
            <h1 class="neon-text">StudyLock</h1>
            <input type="text" id="usernameInput" placeholder="Enter Hero Name" autocomplete="off">
            <button id="loginBtn" class="neon-btn">INITIALIZE</button>
        </div>
    </div>

    <div class="container">
        <header class="glass-header">
            <div class="user-info">
                <h1 id="profileName">Hero</h1>
                <div class="lvl-badge">LVL <span id="level">1</span></div>
            </div>
            <div class="currency">
                <div class="token-pill">
                    <span id="tokens">0</span> <small>TKNS</small>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="glass-card xp-section">
                <div class="xp-header">
                    <span>Experience</span>
                    <span class="xp-text"><span id="xp">0</span> / <span id="xpNeeded">100</span></span>
                </div>
                <div class="xp-bar-container">
                    <div id="xpFill" class="xp-fill"></div>
                </div>
            </section>

            <section class="focus-engine">
                <div class="timer-display">
                    <h2 id="timer" class="glow-text">25:00</h2>
                </div>

                <div class="wheel-controls">
                    <button id="downBtn" class="icon-btn">−</button>
                    <div class="time-setting">
                        <span id="minutesDisplay">25</span><br>
                        <small>MINUTES</small>
                    </div>
                    <button id="upBtn" class="icon-btn">+</button>
                </div>

                <div class="action-grid">
                    <button id="startBtn" class="action-btn start">START FOCUS</button>
                    <button id="pauseBtn" class="action-btn pause">PAUSE</button>
                    <button id="resetBtn" class="action-btn reset">RESET</button>
                </div>
            </section>

            <section class="glass-card battle-arena">
                <div class="battle-header">
                    <h3>BOSS: THE PROCRASTINATOR</h3>
                    <div class="hp-container">
                        <div id="bossHp" class="hp-fill"></div>
                    </div>
                </div>
                <button id="battleBtn" class="boss-trigger">CHALLENGE BOSS</button>
                <p id="battleStatus" class="status-msg">Gate is currently sealed...</p>
            </section>

            <div class="stats-grid">
                <div class="glass-card stat-item">
                    <small>STREAK</small>
                    <p id="streak">1</p>
                </div>
                <div class="glass-card stat-item">
                    <small>RANK</small>
                    <p id="userRank">#1</p>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button id="openShopBtn" class="shop-btn">ARMORY & SHOP</button>
        </nav>
    </div>

    <div id="shopPage" class="modal hidden">
        <div class="modal-content glass-card">
            <h2 class="neon-text">The Armory</h2>
            <div class="shop-item">
                <p>Neon Pulsar HUD</p>
                <button id="buyThemeBtn" class="buy-btn">20 TKNS</button>
            </div>
            <button id="backBtn" class="close-btn">BACK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
