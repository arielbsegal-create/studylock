<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyLock RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="confetti-container"></div>
    <canvas id="particleCanvas"></canvas>

    <div id="loginScreen" class="login">
        <div class="login-circle">
            <h1 class="title-font">STUDYLOCK</h1>
            <input type="text" id="usernameInput" placeholder="ENTER HERO NAME">
            <button id="loginBtn" class="neon-btn cyan-glow">INITIALIZE</button>
        </div>
    </div>

    <div class="container">
        <header class="glass-header">
            <div class="hud-left">
                <span id="profileName" class="title-font">HERO</span>
                <div class="lvl-badge">LVL <span id="level">1</span></div>
            </div>
            <div class="hud-right">
                <span id="tokens">0</span> <small>TKNS</small>
            </div>
        </header>

        <main class="main-content">
            <section class="glass-card reactor">
                <div class="timer-container">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="timerPath" class="timer-path" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <h2 id="timer" class="title-font">25:00</h2>
                </div>
                <div class="wheel-controls">
                    <button id="downBtn" class="icon-btn">−</button>
                    <span id="minutesDisplay">25</span>
                    <button id="upBtn" class="icon-btn">+</button>
                </div>
                <button id="startBtn" class="neon-btn start-glow">START FOCUS</button>
                <button id="pauseBtn" class="neon-btn pause-glow hidden">PAUSE</button>
            </section>

            <div class="side-panel">
                <div class="glass-card">
                    <h4 class="title-font">XP PROGRESS</h4>
                    <div class="xp-bar-container"><div id="xpFill" class="xp-fill"></div></div>
                </div>

                <div class="glass-card spotify-card">
                    <iframe
    width="100%"
    height="352"
    src="https://www.youtube.com/embed/jfKfPfyJRdk"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>
                </div>
            </div>
        </main>

        <button id="openShopBtn" class="neon-btn purple-glow" onclick="toggleShop(true)">OPEN ARMORY</button>
    </div>

    <div id="shopPage" class="modal hidden">
        <div class="shop-content">
            <h2 class="title-font">THE ARMORY</h2>
            <div class="shop-grid">
                <div class="shop-item">
                    <h5>Shield Gen</h5>
                    <button class="purple-glow" onclick="buyItem('shield')">25 TKNS</button>
                </div>
                <div class="shop-item">
                    <h5>Mana Cell</h5>
                    <button class="purple-glow" onclick="buyItem('battery')">10 TKNS</button>
                </div>
            </div>
            <button class="neon-btn" onclick="toggleShop(false)">CLOSE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
